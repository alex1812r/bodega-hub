openapi: 3.0.3
info:
  title: BodegaHub API (BFF)
  version: 0.2.0
  description: Contrato de endpoints internos Next.js (mock en tests, Supabase en runtime).
servers:
  - url: http://localhost:3000
    description: Desarrollo local
security:
  - DemoRole: []
tags:
  - name: Dashboard
  - name: Categories
  - name: Products
  - name: Inventory
  - name: Sales
  - name: Purchases
  - name: Contacts
  - name: SupplierProducts
  - name: Payments
  - name: Payroll
  - name: Reports
  - name: ExchangeRates
  - name: Settings
  - name: Users
  - name: Auth
  - name: Docs
  - name: Assistant
paths:
  /api/cash/registers:
    get: { summary: Listar cajas registradoras }
    post: { summary: Crear caja registradora }
  /api/cash/registers/{id}:
    get: { summary: Obtener caja registradora }
    patch: { summary: Actualizar caja registradora }
  /api/cash/registers/{id}/last-untransferred-closure:
    get: { summary: Ultimo cierre de caja no transferido al baul }
  /api/cash/registers/{id}/sessions:
    get: { summary: Historial de sesiones de una caja registradora }
  /api/cash/session:
    get: { summary: Obtener sesión de caja actual }
  /api/cash/session/open:
    get: { summary: Listar sesiones abiertas }
    post: { summary: Abrir sesión de caja }
  /api/cash/session/close:
    post: { summary: Cerrar sesión de caja }
  /api/cash/movements:
    get: { summary: Listar movimientos de caja }
  /api/cash/closures/pending:
    get: { summary: Listar cierres de caja pendientes de transferir al baul }
  /api/cash/closures/untransferred:
    get: { summary: Listar cierres de caja sin transferir al baul (incluye historicos absorbidos) }
  /api/cron/cash-sessions/auto-close:
    get: { summary: Cerrar sesiones de caja vencidas (medianoche Caracas o 24 h) }
    post: { summary: Cerrar sesiones de caja vencidas (medianoche Caracas o 24 h) }
  /api/vault:
    get: { summary: Obtener baúl de la tienda }
  /api/vault/movements:
    get: { summary: Listar movimientos del baúl }
  /api/vault/deposits:
    post: { summary: Registrar depósito en baúl }
  /api/vault/withdrawals:
    post: { summary: Registrar retiro de baúl }
  /api/vault/transfers-from-cash:
    post: { summary: Transferir efectivo desde caja }
  /api/payroll/settings:
    get:
      tags: [Payroll]
      summary: Obtener parametros de nomina y empleados elegibles
      description: Parametros de `payroll_settings` (con los valores por defecto si la tienda aun no los guardo) mas los perfiles activos con rol elegible y su porcentaje de comision.
      x-permission: payroll.manage
      responses:
        "200":
          $ref: "#/components/responses/PayrollSettingsResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags: [Payroll]
      summary: Actualizar parametros de nomina
      description: RPC `upsert_payroll_settings` cuando `API_DATA_SOURCE=supabase`. El rol admin nunca es elegible.
      x-permission: payroll.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollSettingsInput"
      responses:
        "200":
          $ref: "#/components/responses/PayrollSettingsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/payroll/employees/{profileId}:
    parameters:
      - name: profileId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Payroll]
      summary: Fijar el porcentaje de comision de un cajero
      description: RPC `upsert_payroll_employee`. El porcentaje queda congelado en cada quincena ya calculada.
      x-permission: payroll.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollEmployeeInput"
      responses:
        "200":
          description: Empleado de nomina
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PayrollEmployee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/payroll/periods:
    get:
      tags: [Payroll]
      summary: Listar quincenas de nomina
      description: Paginado, mas reciente primero.
      x-permission: payroll.manage
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de quincenas
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PaginatedList"
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/PayrollPeriod"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Payroll]
      summary: Calcular una quincena
      description: RPC `compute_payroll_period`. Solo quincenas cerradas; la ganancia bruta sale de `getGrossProfitReport` y solo alimenta el semaforo.
      x-permission: payroll.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollPeriodCreateInput"
      responses:
        "201":
          $ref: "#/components/responses/PayrollPeriodResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/payroll/periods/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Payroll]
      summary: Detalle de una quincena
      description: El admin ve la quincena completa; el cajero con `payroll.view_own` solo su propio recibo, sin ganancia bruta ni desglose del dueno.
      x-permission: payroll.manage
      responses:
        "200":
          description: Detalle de la quincena
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PayrollPeriodDetail"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/payroll/periods/{id}/recompute:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Payroll]
      summary: Recalcular una quincena en borrador
      description: Vuelve a calcular los items desde cero. Una quincena aprobada o pagada responde 409.
      x-permission: payroll.manage
      responses:
        "200":
          $ref: "#/components/responses/PayrollPeriodResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/payroll/periods/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Payroll]
      summary: Aprobar una quincena
      description: RPC `approve_payroll_period`. Recalcula por ultima vez y consume las ventas en `payroll_commission_sales`; sin empleados configurados responde 400.
      x-permission: payroll.manage
      responses:
        "200":
          $ref: "#/components/responses/PayrollPeriodResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/payroll/items/{id}/pay:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Payroll]
      summary: Pagar el recibo de un cajero
      description: RPC `pay_payroll_item`. Saca el dinero del baul con un movimiento `payroll_out` (cubeta efectivo o cuenta segun el metodo) y congela la tasa. Saldo insuficiente responde 400 con `INSUFFICIENT_VAULT_BALANCE`.
      x-permission: payroll.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollPayInput"
      responses:
        "200":
          $ref: "#/components/responses/PayrollItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/payroll/items/{id}/cancel-payment:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Payroll]
      summary: Anular el pago de un recibo
      description: RPC `cancel_payroll_payment`. Devuelve el dinero a su cubeta del baul, borra el movimiento y deja el recibo pendiente. La nota es obligatoria.
      x-permission: payroll.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollCancelPaymentInput"
      responses:
        "200":
          $ref: "#/components/responses/PayrollItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/payroll/mine:
    get:
      tags: [Payroll]
      summary: Mis recibos de nomina
      description: Recibos del cajero autenticado con su quincena y las ventas comisionadas. Sin cifras del negocio.
      x-permission: payroll.view_own
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de recibos propios
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PaginatedList"
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/PayrollMineItem"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/payroll/mine/current:
    get:
      tags: [Payroll]
      summary: Estimacion de mi quincena en curso
      description: "Comision acumulada del cajero en la quincena en curso. Solo estima: no escribe nada."
      x-permission: payroll.view_own
      responses:
        "200":
          description: Estimacion del cajero
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PayrollMineCurrent"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/payroll/current:
    get:
      tags: [Payroll]
      summary: Quincena en curso y anterior
      description: Clave de la quincena en curso con la estimacion viva por cajero (RPC `preview_payroll_commissions`) y la quincena anterior si ya fue calculada.
      x-permission: payroll.manage
      responses:
        "200":
          description: Resumen de la quincena en curso
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PayrollCurrentSummary"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/chat:
    post:
      tags: [Assistant]
      summary: Conversar con el asistente IA de consultas
      description: >-
        Stream de mensajes del AI SDK (SSE). El servidor impone el alcance de tiendas
        desde la sesion; el modelo nunca recibe un storeId. Limite diario por usuario
        via ASSISTANT_DAILY_LIMIT.
      x-permission: assistant.use
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  items:
                    type: object
                    required: [role, parts]
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      parts:
                        type: array
                        items: { type: object }
      responses:
        "200":
          description: Stream de mensajes UI del AI SDK
          content:
            text/event-stream:
              schema: { type: string }
        "401":
          description: Sin sesion
        "403": { $ref: "#/components/responses/Forbidden" }
        "429":
          description: Limite diario de consultas alcanzado
        "502":
          description: El proveedor de IA no esta disponible
  /api/assistant/usage:
    get:
      tags: [Assistant]
      summary: Consultas usadas hoy y limite diario del asistente
      x-permission: assistant.use
      responses:
        "200":
          description: Uso diario del asistente
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      used: { type: integer }
                      limit: { type: integer }
                      resetsAt: { type: string, format: date-time }
        "401":
          description: Sin sesion
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/docs:
    get:
      tags: [Docs]
      summary: Redirigir a la documentacion visual de la API
      responses:
        "307":
          description: Redireccion temporal hacia /api-docs
  /api/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Obtener resumen del dashboard
      description: Usa mock o Supabase segun `API_DATA_SOURCE`. Supabase lee `daily_sales_summary`, `low_stock_products` y ventas pendientes.
      x-permission: dashboard.view
      responses:
        "200":
          $ref: "#/components/responses/DashboardSummaryResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/dashboard/metrics:
    get:
      tags: [Dashboard]
      summary: Obtener metricas del dashboard
      description: Usa mock o Supabase segun `API_DATA_SOURCE`. Supabase agrega ventas e items en el rango `from`/`to`.
      x-permission: dashboard.view
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: fromStart
          in: query
          required: false
          description: Si es truthy (`1`, `true`), omite la cota inferior `from`.
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ReportObjectResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/dashboard/sales-trend:
    get:
      tags: [Dashboard]
      summary: Obtener tendencia de ventas para el grafico del dashboard
      description: Usa mock o Supabase segun `API_DATA_SOURCE`. Agrega ventas por dia en el rango `from`/`to`.
      x-permission: dashboard.view
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          $ref: "#/components/responses/ReportObjectResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/dashboard/recent-sales:
    get:
      tags: [Dashboard]
      summary: Obtener ultimas ventas
      description: Usa mock o Supabase segun `API_DATA_SOURCE`. Pagina con `skip`/`limit`.
      x-permission: dashboard.view
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/SaleArrayResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/dashboard/low-stock:
    get:
      tags: [Dashboard]
      summary: Obtener stock bajo compacto
      description: Usa mock o Supabase segun `API_DATA_SOURCE`. Supabase lee la vista `low_stock_products`.
      x-permission: dashboard.view
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/ReportArrayResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/dashboard/daily-close:
    get:
      tags: [Dashboard]
      summary: Cierre del dia
      description: Composicion de ventas (dia operativo Caracas), mix de pagos, perdida FX y snapshot de caja/baul.
      x-permission: dashboard.view
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: fromStart
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/ReportObjectResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/categories:
    get:
      tags: [Categories]
      summary: Listar categorias
      description: Usa mock o Supabase segun `API_DATA_SOURCE`.
      x-permission: products.view
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
      responses:
        "200":
          description: Lista paginada de categorias
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PaginatedList"
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Category"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Categories]
      summary: Crear categoria
      description: Usa mock o Supabase segun `API_DATA_SOURCE`.
      x-permission: products.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Categoria creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Categories]
      summary: Obtener categoria
      x-permission: products.view
      responses:
        "200":
          description: Categoria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Categories]
      summary: Actualizar categoria
      description: Usa mock o Supabase segun `API_DATA_SOURCE`.
      x-permission: products.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryUpdateInput"
      responses:
        "200":
          description: Categoria actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Categories]
      summary: Borrar categoria (soft delete)
      description: Mock devuelve `deleted=true`. Supabase marca `is_active=false`.
      x-permission: products.manage
      responses:
        "200":
          description: Categoria borrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/products:
    get:
      tags: [Products]
      summary: Listar productos
      description: Usa mock o Supabase segun `API_DATA_SOURCE`. Pagina con `skip`/`limit` y `count` exacto.
      x-permission: products.view
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Search"
        - name: isActive
          in: query
          required: false
          schema:
            type: boolean
          description: Filtra productos activos o inactivos.
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
          description: Filtra productos por categoria.
        - name: barcode
          in: query
          required: false
          schema:
            type: string
          description: Codigo de barras exacto. Si se envia, `search` se ignora.
        - name: sku
          in: query
          required: false
          schema:
            type: string
          description: SKU exacto (se normaliza con trim y minusculas, igual que al crear). Si se envia, `search` se ignora; vacio no filtra.
        - name: review
          in: query
          required: false
          schema:
            type: string
            enum: ["1", "true"]
          description: Solo productos en la cola "Por revisar" (su costo subio y la ganancia bajo de banda). Se combina con los demas filtros, el orden y la paginacion.
        - name: packLink
          in: query
          required: false
          schema:
            type: string
            enum: [none, not-pack]
          description: >-
            Filtra por el vinculo de empaque activo del producto, resuelto en el
            servidor. `none` deja solo los productos sin ningun vinculo (ni empaque
            ni componente de una receta activa). `not-pack` deja fuera solo los que
            son el EMPAQUE de una receta activa: son los que pueden elegirse como
            unidad o componente, porque un producto puede salir de varios empaques.
            Cualquier otro valor no filtra. Se combina con los demas filtros, el
            orden y la paginacion.
      responses:
        "200":
          description: Lista paginada de productos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PaginatedList"
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Product"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Products]
      summary: Crear producto
      description: >-
        Usa mock o Supabase segun `API_DATA_SOURCE`. SKU duplicado responde `409`. Con `clientRequestId` el alta
        es idempotente: repetir el mismo cuerpo con la misma clave (reintento tras una respuesta perdida) responde
        `201` con el producto ya creado, sin otro producto ni otro movimiento `inventario_inicial`; la misma clave
        con otro contenido responde `409`.
      x-permission: products.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreateInput"
      responses:
        "201":
          description: Producto creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/products/import/template:
    get:
      tags: [Products]
      summary: Descargar plantilla Excel de importacion masiva
      description: |
        Devuelve un archivo `.xlsx` con hojas Productos, Categorias e Instrucciones.
        Las categorias activas se cargan desde mock o Supabase segun `API_DATA_SOURCE`.
        La importacion fila a fila usa `POST /api/products`.
