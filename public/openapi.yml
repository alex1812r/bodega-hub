                              $ref: "#/components/schemas/ProductPriceHistory"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/products/{id}/keep-price:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Products]
      summary: Mantener el precio de un producto en revision
      description: >-
        Saca el producto de la cola "Por revisar" sin cambiar su precio: registra una fila de historial con precio
        anterior = nuevo = actual (`kind: keep`) que vuelve a guardar el costo y la banda de ganancia del momento.
        Supabase usa la RPC `keep_product_price`; no toca el producto ni el stock. El cuerpo es opcional. Con
        `expectedCostRef`, si el costo del producto ya no es ese (a dos decimales) responde `409` "El costo cambió
        de X a Y; revisa el precio" y no registra nada: el producto sigue en la cola.
      x-permission: products.manage
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductKeepPriceInput"
      responses:
        "200":
          description: Fila de historial registrada y producto (ya sin `priceReview`)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [history, product]
                    properties:
                      history:
                        $ref: "#/components/schemas/ProductPriceHistory"
                      product:
                        $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/products/price-review:
    get:
      tags: [Products]
      summary: Listar la cola "Por revisar" de precios
      description: >-
        Productos activos cuyo costo subio despues de fijar su precio y cuya banda de ganancia actual es peor que la
        guardada entonces (verde a amarillo, amarillo a rojo, verde a rojo). Orden: peor banda primero y, dentro de
        ella, la mayor caida de %. Un producto sale de la cola al cambiar su precio, con "Mantener precio" o si el
        costo vuelve a bajar. Nunca se cambia un precio automaticamente.
      x-permission: products.view
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
        - name: purchaseId
          in: query
          required: false
          schema:
            type: string
          description: Solo los productos cuyo costo subio esa compra (la compra recibida mas reciente posterior al ultimo precio fijado).
      responses:
        "200":
          description: Cola paginada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PaginatedList"
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/ProductPriceReviewItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/products/price-review/summary:
    get:
      tags: [Products]
      summary: Contar los productos de la cola "Por revisar"
      description: Solo el conteo (tarjeta del dashboard).
      x-permission: products.view
      responses:
        "200":
          description: Total de productos en la cola
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [total]
                    properties:
                      total:
                        type: integer
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/products/price-review/reprice:
    post:
      tags: [Products]
      summary: Reprecio masivo al % de ganancia indicado
      description: >-
        Para cada producto la base calcula precio = costo x (1 + markupPct / 100), redondeado a dinero, con el
        producto bloqueado y sobre su costo vigente (RPC `reprice_product_to_markup`; motivo por defecto "Reprecio
        al X %"). Un fallo no aborta el lote: la respuesta es 200 con un resultado por producto (`ok` con el precio
        nuevo o `error` con codigo y mensaje). Un producto sin costo responde `NO_COST` en su fila: nunca se le
        pone precio 0. Los productos llegan en `items` (con el costo que el usuario vio: si ya es otro, esa fila
        responde `COST_CHANGED` y su precio no cambia), en `productIds` (sin esa comprobacion) o en ambos; entre
        los dos, de 1 a 100 productos distintos.
      x-permission: products.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRepriceInput"
      responses:
        "200":
          description: Resultado por producto
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ProductRepriceResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/products/{id}/sales:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Skip"
      - $ref: "#/components/parameters/Limit"
    get:
      tags: [Products]
      summary: Obtener historial de ventas del producto
      description: Lista `sale_items` del SKU unidos a `sales`, ordenados por `created_at` desc. Las filas `cancelada` se muestran; los totales `units`/`totalRef`/`totalVes` las excluyen y cubren todo el conjunto, no solo la página. Pagina con `skip`/`limit`.
      x-permission: products.view
      responses:
        "200":
          description: Historial paginado de ventas del producto
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PaginatedList"
                      - type: object
                        required: [items, totals]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/ProductSaleHistory"
                          totals:
                            $ref: "#/components/schemas/ProductSaleHistoryTotals"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/products/{id}/barcode:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Products]
      summary: Asignar codigo de barras a un producto sin barcode
      x-permission: products.view
      responses:
        "200":
          $ref: "#/components/responses/ReportObjectResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/products/{id}/suppliers:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Products]
      summary: Listar proveedores de un producto
      description: >-
        Vinculos proveedor-producto del producto (activos e inactivos; `isActive=true` deja solo los activos). Cada
        fila trae `isPreferred`: el proveedor habitual del producto (como mucho uno).
      x-permission: products.view
      responses:
        "200":
          $ref: "#/components/responses/SupplierProductArrayResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Products]
      summary: Guardar los proveedores de un producto
      description: >-
        El cuerpo es el estado DESEADO completo de los vinculos activos del producto, en una sola llamada y una sola
        transaccion (RPC `save_product_suppliers`): crea los vinculos que faltan (reactiva el que existia inactivo),
        actualiza costo y codigo, DESACTIVA (no borra) los activos que no vienen y fija el proveedor habitual. El costo
        pasa por el historial de precios del proveedor. El mismo proveedor repetido se funde en una fila (gana la
        ultima aparicion; habitual si alguna lo marca). Habitual: el marcado; si ninguno, se conserva el actual si
        sigue en la lista; si no, pasa al primero de la lista con proveedor activo; lista vacia = sin proveedores ni
        habitual. 400: proveedor inexistente, de otra tienda o que no es proveedor / ambos; proveedor inactivo en un
        vinculo nuevo o marcado habitual; mas de un habitual; costo negativo; mas de 50 filas. Requiere ademas acceso a
        contactos proveedor (el vendedor recibe 403) y, en Supabase, rol admin o almacen. No toca el producto, su costo,
        su precio ni el stock.
      x-permission: products.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductSuppliersInput"
      responses:
        "200":
          description: Vinculos activos tras guardar y resultado del proveedor habitual
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/ProductSuppliersResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
