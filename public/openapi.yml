        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/platform/users/{id}:
    get:
      tags: [Platform]
      summary: Ver detalle de un usuario de tienda
      x-permission: platform.users.view
      responses:
        "200": { description: Detalle de usuario }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/platform/reports/{report}:
    get:
      tags: [Platform]
      summary: Generar un reporte de plataforma con alcance multi-tienda
      description: |
        Mismos reportes que `/api/reports/*`.
        `storeScope=all` (default), `one` o `selected`.
        Con `one`/`selected` requiere `storeIds` (CSV o repetido `storeId`).
      x-permission: platform.reports.view
      parameters:
        - name: report
          in: path
          required: true
          schema:
            type: string
            enum:
              [
                daily-sales,
                gross-profit,
                product-profitability,
                low-stock,
                customer-purchases,
                supplier-purchases,
                stock-card,
                top-products,
                top-customers,
                purchases,
              ]
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
        - name: storeScope
          in: query
          schema: { type: string, enum: [all, one, selected], default: all }
        - name: storeIds
          in: query
          schema: { type: string }
          description: UUIDs separados por coma
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: productId
          in: query
          schema: { type: string }
        - name: supplierId
          in: query
          schema: { type: string }
      responses:
        "200": { description: Lista paginada del reporte }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/platform/home/summary:
    get:
      tags: [Platform]
      summary: Resumen agregado multi-tienda
      x-permission: platform.dashboard.view
      parameters:
        - name: storeScope
          in: query
          schema: { type: string, enum: [all, one, selected], default: all }
        - name: storeIds
          in: query
          schema: { type: string }
      responses:
        "200": { description: Resumen del dia agregado }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/platform/home/metrics:
    get:
      tags: [Platform]
      summary: Metricas de periodo multi-tienda
      x-permission: platform.dashboard.view
      parameters:
        - name: storeScope
          in: query
          schema: { type: string, enum: [all, one, selected], default: all }
        - name: storeIds
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: fromStart
          in: query
          description: Si es truthy (`1`, `true`), omite la cota inferior `from`.
          schema: { type: string }
      responses:
        "200": { description: Metricas del periodo }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/platform/home/sales-trend:
    get:
      tags: [Platform]
      summary: Tendencia de ventas multi-tienda (rollup por fecha)
      x-permission: platform.dashboard.view
      parameters:
        - name: storeScope
          in: query
          schema: { type: string, enum: [all, one, selected], default: all }
        - name: storeIds
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200": { description: Serie diaria agregada }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/platform/home/recent-sales:
    get:
      tags: [Platform]
      summary: Ventas recientes multi-tienda
      x-permission: platform.dashboard.view
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
        - name: storeScope
          in: query
          schema: { type: string, enum: [all, one, selected], default: all }
        - name: storeIds
          in: query
          schema: { type: string }
      responses:
        "200": { description: Lista paginada de ventas }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/platform/home/low-stock:
    get:
      tags: [Platform]
      summary: Bajo stock multi-tienda
      x-permission: platform.dashboard.view
      parameters:
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
        - name: storeScope
          in: query
          schema: { type: string, enum: [all, one, selected], default: all }
        - name: storeIds
          in: query
          schema: { type: string }
      responses:
        "200": { description: Lista paginada de productos }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/platform/home/exchange-rate:
    get:
      tags: [Platform]
      summary: Tasa REF/VES de referencia para el header de plataforma
      x-permission: platform.dashboard.view
      responses:
        "200": { description: Tasa vigente }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/users:
    get:
      tags: [Users]
      summary: Listar perfiles de la tienda
      x-permission: users.manage
      responses:
        "200":
          description: Usuarios de la tienda
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items, limit, skip, total]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/UserProfile"
                      limit: { type: integer }
                      skip: { type: integer }
                      total: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      summary: Crear usuario de la tienda
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName, password, role]
              properties:
                email: { type: string, format: email }
                fullName: { type: string, minLength: 1 }
                password: { type: string, minLength: 8 }
                role:
                  type: string
                  enum: [admin, vendedor, almacen, contador]
      responses:
        "201":
          $ref: "#/components/responses/UserProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Users]
      summary: Actualizar perfil mock
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileInput"
      responses:
        "200":
          $ref: "#/components/responses/UserProfileResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Obtener usuario actual mock
      responses:
        "200":
          $ref: "#/components/responses/ReportObjectResponse"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login mock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          $ref: "#/components/responses/ReportObjectResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout mock
      responses:
        "200":
          $ref: "#/components/responses/ReportObjectResponse"
  /api/openapi:
    get:
      tags: [Docs]
      summary: Servir contrato OpenAPI YAML
      responses:
        "200":
          description: Contrato OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string
  /api/docs:
    get:
      tags: [Docs]
      summary: Redirigir a Swagger UI
      responses:
        "307":
          description: Redireccion temporal a `/api-docs`.
components:
  securitySchemes:
    DemoRole:
      type: apiKey
      in: header
      name: x-demo-role
      description: "Rol temporal para endpoints mock: admin, vendedor, almacen o contador."
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
    Skip:
      name: skip
      in: query
      required: false
      description: Registros a omitir desde el inicio del resultado filtrado.
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      required: false
      description: Cantidad por pagina. Minimo 10, default 10.
      schema:
        type: integer
        minimum: 10
        default: 10
  responses:
    BadRequest:
      description: Solicitud invalida (cuerpo que no es JSON valido, campos que no cumplen el schema o rechazo de negocio)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Sin permiso
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflicto de negocio, por ejemplo SKU duplicado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    IdempotencyConflict:
      description: >-
        Conflicto. La clave `clientRequestId` ya se uso con otro contenido (o no se
        puede repetir), o la operacion choco con otra en curso y no se aplico: en
        ese caso `error.details.retryable` es `true` y basta reintentar.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    PayrollSettingsResponse:
      description: Parametros de nomina y empleados elegibles
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [settings, employees]
                properties:
                  settings:
                    $ref: "#/components/schemas/PayrollSettings"
                  employees:
                    type: array
                    items:
                      $ref: "#/components/schemas/PayrollEmployee"
    PayrollPeriodResponse:
      description: Quincena de nomina
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/PayrollPeriod"
    PayrollItemResponse:
      description: Recibo de nomina de un cajero
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/PayrollItem"
    DashboardSummaryResponse:
      description: Resumen del dashboard
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/DashboardSummary"
    ReportArrayResponse:
      description: Lista paginada generica
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/PaginatedList"
    ReportObjectResponse:
      description: Objeto generico
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
    SaleArrayResponse:
      description: Lista paginada de ventas
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Sale"
    SupplierProductArrayResponse:
      description: Lista paginada de relaciones proveedor-producto
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/SupplierProduct"
    SupplierProductPriceHistoryArrayResponse:
      description: Lista paginada de historial de precios proveedor-producto
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                allOf:
                  - $ref: "#/components/schemas/PaginatedList"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/SupplierProductPriceHistory"
    UserProfileResponse:
      description: Perfil de usuario
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: "#/components/schemas/UserProfile"
  schemas:
    PaginatedList:
      type: object
      required: [items, skip, limit, total]
      properties:
        items:
          type: array
          items:
            type: object
        skip:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 10
        total:
          type: integer
          minimum: 0
    OpenDocument:
      type: object
      description: Venta por cobrar o compra por pagar que `register_payment` aun acepta.
      required:
        - type
        - id
        - number
        - status
        - createdAt
        - totalVes
        - paidVes
        - pendingVes
        - totalRef
        - refRateVes
      properties:
        type:
          type: string
          enum: [sale, purchase]
        id:
          type: string
        number:
          type: string
          description: "`invoice_number` de la venta o `purchase_number` de la compra."
        status:
          type: string
          enum: [pendiente_pago, pagada, pedido, recibido]
        createdAt:
          type: string
          format: date-time
        contact:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
            taxId:
              type: string
        totalVes:
          type: number
        paidVes:
          type: number
        pendingVes:
          type: number
          description: "`roundMoney(totalVes - paidVes)`, siempre mayor que cero."
        totalRef:
          type: number
        paidRef:
          type: number
          description: Solo compras.
        pendingRef:
          type: number
          description: "Compras: `totalRef - paidRef`. Ventas: `pendingVes / refRateVes`."
        refRateVes:
          type: number
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [BAD_REQUEST, CONFLICT, FORBIDDEN, INTERNAL_ERROR, NOT_FOUND, UNAUTHORIZED]
            message:
              type: string
            issues:
              type: array
              items:
                type: object
            details:
              type: object
              description: Datos adicionales del error, por ejemplo `retryable` en un 409 reintentable.
              properties:
                retryable:
                  type: boolean
    ContactType:
      type: string
      enum: [cliente, proveedor, ambos]
    SaleStatus:
      type: string
      enum: [borrador, pendiente_pago, pagada, cancelada, devuelta]
    PurchaseStatus:
      type: string
      enum: [pedido, recibido, cancelado, devuelto]
    PaymentDirection:
      type: string
      enum: [entrada, salida]
    PaymentMethod:
      type: string
      enum: [efectivo_ves, efectivo_usd, pago_movil, punto_venta, transferencia]
    StockMovementType:
      type: string
      enum:
        - venta
        - compra
        - ajuste_entrada
        - ajuste_salida
        - conversion_salida
        - conversion_entrada
        - devolucion_cliente
        - devolucion_proveedor
        - inventario_inicial
    UserRole:
      type: string
      enum: [admin, vendedor, almacen, contador]
    Permission:
      type: string
      enum:
        - dashboard.view
        - sales.view
        - sales.create
        - purchases.view
        - purchases.create
        - inventory.view
        - inventory.manage
        - products.view
        - products.manage
        - contacts.view
        - contacts.manage
        - payments.view
        - payments.manage
        - reports.view
        - settings.view
        - users.manage
    Category:
      type: object
      required: [id, name, taxRate]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        taxRate:
          type: number
          minimum: 0
          maximum: 100
          description: Impuesto de la categoria en porcentaje (ej. 16 = IVA 16%).
        taxRateId:
          type: string
          description: >-
            Alicuota de IVA de la categoria (`id` de /api/tax-rates). Solo lectura:
            se deriva de `taxRate`, que debe ser el porcentaje de una alicuota de la
            tienda (si no, 400 al guardar). `taxRate` siempre es el `pct` de esta alicuota.
        defaultMarkupPct:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000
          description: >-
            % de ganancia sugerido de la categoria (markup sobre el costo en REF, dos
            decimales). Se ofrece como primer chip al fijar el precio de sus productos; no cambia ningun precio. Ausente o `null` = sin sugerencia.
        isActive:
          type: boolean
    CategoryResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Category"
    CategoryInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        taxRate:
          type: number
          minimum: 0
          maximum: 100
        defaultMarkupPct:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000
          description: >-
            % de ganancia sugerido de la categoria (markup sobre el costo en REF, dos
            decimales). Opcional; mayor que 0 y como maximo 1000 (si no, 400).
    CategoryUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        taxRate:
          type: number
          minimum: 0
          maximum: 100
        defaultMarkupPct:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000
          description: >-
            % de ganancia sugerido de la categoria (markup sobre el costo en REF, dos
            decimales). `null` borra la sugerencia; sin el campo, no se toca.
        isActive:
          type: boolean
    ProductSuppliersInput:
      type: object
      required: [suppliers]
      properties:
        suppliers:
          type: array
          maxItems: 50
          items:
            type: object
            required: [supplierId]
            properties:
              supplierId:
                type: string
              costRef:
                type: number
                nullable: true
                minimum: 0
                description: Costo REF por unidad. Sin el (o null) el costo del vinculo no se toca.
              supplierSku:
                type: string
                nullable: true
                description: Codigo del proveedor. Sin la clave no se toca; null o vacio lo borra.
              isPreferred:
                type: boolean
                description: Como mucho uno en true.
    ProductSupplierLink:
      type: object
      required: [id, supplierId, supplierName, supplierIsActive, costRef, isPreferred]
      properties:
        id:
          type: string
          description: Id del vinculo proveedor-producto.
        supplierId:
          type: string
        supplierName:
          type: string
        supplierIsActive:
          type: boolean
        costRef:
          type: number
          description: Ultimo costo REF por unidad registrado (0 = sin costo registrado).
        supplierSku:
          type: string
        isPreferred:
          type: boolean
        lastPurchasedAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProductSuppliersResult:
      type: object
      required: [suppliers, preferredSupplierId, previousPreferredSupplierId, preferredChanged, preferredAutoAssigned]
      properties:
        suppliers:
          type: array
          description: Vinculos activos tras guardar; el habitual primero, despues por nombre.
          items:
            $ref: "#/components/schemas/ProductSupplierLink"
        preferredSupplierId:
          type: string
          nullable: true
        previousPreferredSupplierId:
          type: string
          nullable: true
        preferredChanged:
          type: boolean
          description: El habitual final es distinto del que habia antes de guardar.
        preferredAutoAssigned:
          type: boolean
          description: El servidor movio o quito el habitual sin que la lista marcara uno.
    SupplierProduct:
      type: object
      required: [id, supplierId, productId, isActive]
      properties:
        id:
          type: string
        supplierId:
          type: string
        productId:
          type: string
        isPreferred:
          type: boolean
          description: Proveedor habitual del producto (como mucho uno por producto; nunca un vinculo inactivo).
        lastCostRef:
          type: number
          minimum: 0
        lastCostVes:
          type: number
          minimum: 0
        lastPurchasedAt:
          type: string
          format: date-time
        supplierSku:
          type: string
        notes:
          type: string
        isActive:
          type: boolean
        lastPriceOrigin:
          $ref: "#/components/schemas/SupplierProductPriceOrigin"
        variationPercent:
          type: number
          description: Variacion porcentual vs penultimo registro de historial (null si primer registro)
        supplier:
          $ref: "#/components/schemas/Contact"
        product:
          $ref: "#/components/schemas/Product"
        packUnits:
          type: array
          items:
            $ref: "#/components/schemas/SupplierProductPackUnit"
        defaultPackUnit:
          $ref: "#/components/schemas/SupplierProductPackUnit"
    SupplierProductPackUnit:
      type: object
      required: [id, supplierProductId, label, unitsPerPack, isDefault, isActive]
      properties:
        id:
          type: string
        supplierProductId:
          type: string
        label:
          type: string
        unitsPerPack:
          type: integer
          minimum: 1
        isDefault:
          type: boolean
        isActive:
          type: boolean
    SupplierProductPackUnitInput:
      type: object
      required: [label, unitsPerPack]
      properties:
        label:
          type: string
          minLength: 1
        unitsPerPack:
          type: integer
          minimum: 1
        isDefault:
          type: boolean
    SupplierProductPackUnitUpdateInput:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        unitsPerPack:
          type: integer
          minimum: 1
        isDefault:
          type: boolean
        isActive:
          type: boolean
    SupplierProductPriceOrigin:
      type: string
      enum: [cotizacion, compra, ajuste, vinculacion]
    SupplierProductPriceHistory:
      type: object
      required: [id, supplierProductId, newCostRef, origin, createdAt]
      properties:
        id:
          type: string
        supplierProductId:
          type: string
        oldCostRef:
          type: number
          minimum: 0
        newCostRef:
          type: number
          minimum: 0
        oldCostVes:
          type: number
          minimum: 0
        newCostVes:
          type: number
          minimum: 0
        origin:
          $ref: "#/components/schemas/SupplierProductPriceOrigin"
        variationPercent:
          type: number
          description: Calculado en mapper cuando oldCostRef > 0
        changedBy:
          type: string
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
    RegisterSupplierPriceResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [supplierProduct, historyId]
          properties:
            supplierProduct:
              $ref: "#/components/schemas/SupplierProduct"
            variationPercent:
              type: number
            historyId:
              type: string
    SupplierProductResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SupplierProduct"
    SupplierProductInput:
      type: object
      required: [supplierId, productId]
      properties:
        supplierId:
          type: string
        productId:
          type: string
        lastCostRef:
          type: number
          minimum: 0
        lastCostVes:
          type: number
          minimum: 0
        supplierSku:
          type: string
        notes:
          type: string
    SupplierProductUpdateInput:
      type: object
      properties:
        supplierSku:
          type: string
        notes:
          type: string
        isActive:
          type: boolean
    SupplierProductPriceInput:
      type: object
      required: [newCostRef, origin]
      properties:
        newCostRef:
          type: number
          minimum: 0
        newCostVes:
          type: number
          minimum: 0
        origin:
          $ref: "#/components/schemas/SupplierProductPriceOrigin"
        notes:
          type: string
    Product:
      type: object
      required: [id, sku, name, salePriceRef, currentCostRef, currentStock, minStock, isActive]
      properties:
        id:
          type: string
        categoryId:
          type: string
        sku:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
          maxLength: 500
          description: Texto libre del producto. `null` = sin descripcion.
        salePriceRef:
          type: number
        currentCostRef:
          type: number
        currentStock:
          type: integer
        minStock:
          type: integer
        isActive:
          type: boolean
        priceReview:
          allOf:
            - $ref: "#/components/schemas/ProductPriceReview"
          description: Solo si el producto esta en la cola "Por revisar" (listado y detalle).
        preferredSupplier:
          type: object
          required: [id, name]
          description: >-
            Proveedor habitual del producto, si tiene (listado y detalle). No se envia a los roles sin acceso a
            contactos proveedor.
          properties:
            id:
              type: string
            name:
              type: string
        packConversion:
          allOf:
            - $ref: "#/components/schemas/ProductPackConversion"
          description: Solo en el detalle, y solo si el producto es empaque o sale de alguno.
    ProductPackConversionLinkedProduct:
      type: object
      required: [id, sku, name, salePriceRef, currentCostRef, currentStock]
      properties:
        id:
          type: string
        sku:
          type: string
        name:
          type: string
        salePriceRef:
          type: number
        currentCostRef:
          type: number
        currentStock:
          type: integer
    ProductPackConversionComponent:
      type: object
      required: [unitProductId, name, sku, unitsPerPack, costWeight, isActive, currentStock]
      properties:
        unitProductId:
          type: string
        name:
          type: string
        sku:
          type: string
        unitsPerPack:
          type: integer
          minimum: 1
        costWeight:
          type: number
          description: Peso relativo en el reparto del costo del empaque (unidades x peso).
        isActive:
          type: boolean
        currentStock:
          type: integer
    ProductPackConversionSource:
      type: object
      description: Una receta activa de la que sale el producto.
      required: [conversionId, packProductId, packName, unitsPerPack, totalUnits]
      properties:
        conversionId:
          type: string
        packProductId:
          type: string
        packName:
          type: string
        unitsPerPack:
          type: integer
          description: Unidades de ESTE producto por empaque.
        totalUnits:
          type: integer
          description: Unidades que salen del empaque en total.
    ProductPackConversion:
      type: object
      description: >-
        Vinculo de empaque de un producto. `id`, `unitsPerPack`, `linkedProduct`,
        `kind`, `label`, `totalUnits` y `components` describen UNA receta. Con
        `role` = `pack` es la receta activa del producto: `unitsPerPack` = unidades
        que salen en total y `linkedProduct` = su componente (en un surtido, el
        primero por nombre). Con `role` = `unit` es la primera receta de la que sale
        el producto (por nombre del empaque): `unitsPerPack` = unidades de este
        producto por empaque y `linkedProduct` = ese empaque; `sources` las trae
        todas. Un producto que es empaque y ademas componente de otra receta se
        informa como `pack`, con `sources`.
      required: [id, role, unitsPerPack, linkedProduct, kind, label, totalUnits, components, sources]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [pack, unit]
        unitsPerPack:
          type: integer
        linkedProduct:
          $ref: "#/components/schemas/ProductPackConversionLinkedProduct"
        kind:
          type: string
          enum: [single, assorted]
          description: Con `single` hay un solo producto unidad; `assorted` es un surtido.
        label:
          type: string
          nullable: true
        totalUnits:
          type: integer
        components:
          type: array
          description: Componentes de la receta, por nombre.
          items:
            $ref: "#/components/schemas/ProductPackConversionComponent"
        sources:
          type: array
          description: Recetas activas de las que sale el producto, por nombre del empaque.
          items:
            $ref: "#/components/schemas/ProductPackConversionSource"
    PackConversionInput:
      type: object
      description: >-
        Receta del empaque en el alta / edicion de producto. `enabled: false`
        desactiva la receta. `link_existing` (con `unitProductId`) y `create_unit`
        (con `unitProduct`) son el par de siempre y piden `unitsPerPack`.
        `assorted` es un surtido: `totalUnits` y de 2 a 20 `components` sin
        repetir, ninguno el propio empaque, cuyas unidades suman `totalUnits`
        (si no, `400`). Un componente puede salir de varios empaques, pero no puede
        ser el empaque de una receta activa (`409`). Cambiar los productos de una
        receta crea una receta nueva y deja inactiva la anterior.
      required: [enabled]
      properties:
        enabled:
          type: boolean
        mode:
          type: string
          enum: [link_existing, create_unit, assorted]
        unitProductId:
          type: string
        unitsPerPack:
          type: integer
          minimum: 2
        unitProduct:
          type: object
          required: [salePriceRef]
          properties:
            name:
              type: string
            sku:
              type: string
            barcode:
              type: string
              nullable: true
            salePriceRef:
              type: number
              minimum: 0
            currentCostRef:
              type: number
              minimum: 0
        label:
          type: string
          nullable: true
          maxLength: 80
        totalUnits:
          type: integer
          minimum: 2
        components:
          type: array
          minItems: 2
          maxItems: 20
          items:
            type: object
            required: [unitProductId, unitsPerPack]
            properties:
              unitProductId:
                type: string
              unitsPerPack:
                type: integer
                minimum: 1
              costWeight:
                type: number
                exclusiveMinimum: true
                minimum: 0
                default: 1
    PackConversionOpenedComponent:
      type: object
      description: Lo que recibio un componente al abrir el empaque.
      required: [unitProductId, units, costWeight, allocatedValueRef, unitCostRef, newCostRef, isActive, movement]
      properties:
        unitProductId:
          type: string
        units:
          type: integer
        costWeight:
          type: number
        allocatedValueRef:
          type: number
          description: Parte del valor del empaque asignada (4 decimales). La suma de todas es el valor transferido.
        unitCostRef:
          type: number
          description: Costo por unidad de lo que entro en esta apertura.
        newCostRef:
          type: number
          description: Costo del producto tras la apertura (promedio ponderado).
        isActive:
          type: boolean
        movement:
          $ref: "#/components/schemas/StockMovement"
    ProductPriceReview:
      type: object
      description: Por que un producto esta en la cola "Por revisar" - ganancia y costo al fijar el precio frente a los actuales.
      required:
        - previousBand
        - currentBand
        - previousMarginPct
        - currentMarginPct
        - previousCostRef
        - currentCostRef
        - snapshotAt
      properties:
        previousBand:
          type: string
          enum: [low, mid, high]
          description: Banda guardada al fijar el precio (low rojo, mid amarillo, high verde).
        currentBand:
          type: string
          enum: [low, mid, high]
          description: Banda actual con los umbrales de la tienda.
        previousMarginPct:
          type: number
          description: "% de ganancia del precio vigente sobre el costo guardado."
        currentMarginPct:
          type: number
          description: "% de ganancia del precio vigente sobre el costo actual."
        previousCostRef:
          type: number
        currentCostRef:
          type: number
        snapshotAt:
          type: string
          format: date-time
          description: Cuando se fijo (o se mantuvo) el precio por ultima vez.
        purchase:
          type: object
          description: Compra recibida que subio el costo. Ausente si el costo cambio por otra via (edicion, importacion).
          required: [id, number, receivedAt]
          properties:
            id:
              type: string
            number:
              type: string
            receivedAt:
              type: string
              format: date-time
            supplierName:
              type: string
    ProductPriceReviewItem:
      allOf:
        - $ref: "#/components/schemas/ProductPriceReview"
        - type: object
          required: [productId, name, sku, salePriceRef]
          properties:
            productId:
              type: string
            name:
              type: string
            sku:
              type: string
            salePriceRef:
              type: number
    ProductKeepPriceInput:
      type: object
      properties:
        expectedCostRef:
          type: number
          minimum: 0
          description: >-
            Costo (REF) con el que se mostro la ganancia que el usuario acepta. Si el producto ya cuesta otra cosa
            (a dos decimales) responde 409 y no se registra nada.
        reason:
          type: string
          nullable: true
          maxLength: 200
          description: Motivo. Ausente, null o en blanco se guarda "Precio mantenido".
    ProductRepriceInput:
      type: object
      required: [markupPct]
      description: Al menos uno de `items` o `productIds`; entre los dos, de 1 a 100 productos distintos.
      properties:
        items:
          type: array
          maxItems: 100
          description: Productos con el costo que el usuario vio. Si un producto esta tambien en `productIds`, manda este.
          items:
            type: object
            required: [productId, expectedCostRef]
            properties:
              productId:
                type: string
              expectedCostRef:
                type: number
                minimum: 0
                description: Costo (REF) de la vista previa. Si ya es otro (a dos decimales), la fila responde COST_CHANGED.
        productIds:
          type: array
          maxItems: 100
          description: Productos sin comprobacion de costo esperado; el precio sale del costo vigente.
          items:
            type: string
        markupPct:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 1000
          description: "% de ganancia sobre el costo."
        reason:
          type: string
          nullable: true
          maxLength: 200
          description: Motivo. Ausente, null o en blanco se guarda "Reprecio al X %".
    ProductRepriceResult:
      type: object
      required: [results, updated, failed]
      properties:
        updated:
          type: integer
        failed:
          type: integer
        results:
          type: array
          items:
            oneOf:
              - type: object
                required: [productId, status, salePriceRef]
                properties:
                  productId:
                    type: string
                  status:
                    type: string
                    enum: [ok]
                  salePriceRef:
                    type: number
                    description: Precio nuevo aplicado.
              - type: object
                required: [productId, status, code, message]
                properties:
                  productId:
                    type: string
                  status:
                    type: string
                    enum: [error]
                  code:
                    type: string
                    description: >-
                      NO_COST, COST_CHANGED (el costo ya no es el `expectedCostRef` enviado; el precio no cambio),
                      NOT_FOUND o el codigo del error de la API (FORBIDDEN, BAD_REQUEST, CONFLICT...).
                  message:
                    type: string
    ProductResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Product"
    ProductCreateInput:
      type: object
      required: [name, sku, salePriceRef]
      properties:
        categoryId:
          type: string
        clientRequestId:
          type: string
          format: uuid
          description: >-
            Clave de idempotencia del alta (opcional). El formulario genera una por intento y la repite al
            reintentar el mismo envio.
        currentCostRef:
          type: number
          minimum: 0
        currentStock:
          type: integer
          minimum: 0
        description:
          type: string
          nullable: true
          maxLength: 500
          description: >-
            Opcional. Se guarda sin espacios sobrantes ni caracteres de control; en blanco, `null` o ausente
            queda `null`. Mas de 500 caracteres responde 400. Entra en la huella de idempotencia del alta.
        minStock:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 1
        salePriceRef:
          type: number
          minimum: 0
        sku:
          type: string
          minLength: 1
        packConversion:
          $ref: "#/components/schemas/PackConversionInput"
    ProductUpdateInput:
      type: object
      description: >-
        El stock no se edita por aqui: enviar `currentStock` responde 400. Las
        existencias solo cambian con movimientos (ventas, compras y
        `POST /api/inventory/adjustments`).
      properties:
        categoryId:
          type: string
        currentCostRef:
          type: number
          minimum: 0
        description:
          type: string
          nullable: true
          maxLength: 500
          description: >-
            Ausente: se conserva la guardada. En blanco o `null`: se borra. Mas de 500 caracteres responde 400.
        minStock:
          type: integer
          minimum: 0
        name:
          type: string
          minLength: 1
        salePriceRef:
          type: number
          minimum: 0
        sku:
          type: string
          minLength: 1
        packConversion:
          $ref: "#/components/schemas/PackConversionInput"
    ProductPriceInput:
      type: object
      required: [salePriceRef]
      properties:
        expectedCostRef:
          type: number
          minimum: 0
          description: >-
            Costo (REF) sobre el que el usuario decidio el precio. Si el producto ya cuesta otra cosa (a dos
            decimales) responde 409 y el precio no cambia.
        salePriceRef:
          type: number
          minimum: 0
    ProductPriceHistory:
      type: object
      required: [id, productId, salePriceRef, previousSalePriceRef, kind, reason, createdAt, userId]
      properties:
        id:
          type: string
        productId:
          type: string
        salePriceRef:
          type: number
          description: Precio nuevo.
        previousSalePriceRef:
          type: number
          nullable: true
          description: Precio antes del cambio, tal como lo guardo la fila. Null si no se registro.
        kind:
          type: string
          enum: [change, keep, baseline]
          description: >-
            change = cambio de precio; keep = el precio se mantuvo ("Mantener precio"); baseline = linea base de
            ganancia del producto (alta o migracion). En keep y baseline el precio anterior y el nuevo coinciden.
        reason:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        userId:
          type: string
    ProductSaleHistory:
      type: object
      required:
        - id
        - saleId
        - invoiceNumber
        - createdAt
        - quantity
        - unitPriceRef
        - subtotalRef
        - subtotalVes
        - status
      properties:
        id:
          type: string
        saleId:
          type: string
        invoiceNumber:
          type: string
        createdAt:
          type: string
          format: date-time
        quantity:
          type: number
        unitPriceRef:
          type: number
        subtotalRef:
          type: number
        subtotalVes:
          type: number
        status:
          $ref: "#/components/schemas/SaleStatus"
    ProductSaleHistoryTotals:
      type: object
      required: [units, totalRef, totalVes]
      properties:
        units:
          type: number
        totalRef:
          type: number
        totalVes:
          type: number
    Contact:
      type: object
      required: [id, name, type, isActive]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: "#/components/schemas/ContactType"
        taxId:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        isActive:
          type: boolean
    ContactResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Contact"
    ContactCreateInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/ContactType"
        taxId:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
    ContactUpdateInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        type:
          $ref: "#/components/schemas/ContactType"
        taxId:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
    Sale:
      type: object
      required: [id, invoiceNumber, customerId, status, totalRef, totalVes, paidVes]
      properties:
        id:
          type: string
        invoiceNumber:
          type: string
        customerId:
          type: string
        status:
          $ref: "#/components/schemas/SaleStatus"
        subtotalRef:
          type: number
        discountRef:
          type: number
        taxRef:
          type: number
        totalRef:
          type: number
        totalVes:
          type: number
        paidVes:
          type: number
        refRateVes:
          type: number
        notes:
          type: string
        createdAt:
          type: string
          format: date-time
    SaleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Sale"
    SaleCreateInput:
      type: object
      required: [clientRequestId, customerId, items]
      description: >-
        Con `payments` la venta y sus cobros se registran en una sola transaccion
        (RPC `create_sale_with_payments`): si un cobro falla no queda venta ni
        descuento de stock. `clientRequestId` es la clave de idempotencia por
        intento de cobro y es obligatoria (400 si falta o no es uuid): repetir la
        peticion con la misma clave devuelve la venta ya creada en vez de
        duplicarla; la misma clave con otro contenido responde 409.
      properties:
        clientRequestId:
          type: string
          format: uuid
        customerId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/LineItemInput"
        payments:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/SalePaymentLineInput"
        discountRef:
          type: number
          minimum: 0
        taxRef:
          type: number
          minimum: 0
        refRateVes:
          type: number
          minimum: 0
          exclusiveMinimum: true
    SalePaymentLineInput:
      type: object
      required: [amount, method]
      description: >-
        Linea de cobro que viaja con la venta. Mismas reglas por metodo que
        `POST /api/payments` (pago movil: banco, telefono y referencia de 4
        digitos; transferencia: banco y referencia), sin `saleId`.
      properties:
        amount:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 1000000000000
        method:
          $ref: "#/components/schemas/PaymentMethod"
        currency:
          type: string
          enum: [USD, VES]
        bankName:
          type: string
        phone:
          type: string
        referenceCode:
          type: string
        notes:
          type: string
        change:
          type: object
          description: Vuelto entregado por el excedente de esta linea.
          properties:
            amount:
              type: number
              minimum: 0
              maximum: 1000000000000
            method:
              $ref: "#/components/schemas/PaymentMethod"
        receivedDenominations:
          type: object
          description: 'Desglose de billetes recibidos por moneda, p. ej. {"USD":{"20":1}}.'
        changeDenominations:
          type: object
          description: Desglose de billetes entregados como vuelto.
    Purchase:
      type: object
      required: [id, purchaseNumber, supplierId, status, totalRef, totalVes, paidVes]
      properties:
        id:
          type: string
        purchaseNumber:
          type: string
        supplierId:
          type: string
        status:
          $ref: "#/components/schemas/PurchaseStatus"
        subtotalRef:
          type: number
        discountRef:
          type: number
        taxRef:
          type: number
        totalRef:
          type: number
        totalVes:
          type: number
        paidVes:
          type: number
        refRateVes:
          type: number
    PurchaseResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Purchase"
    PurchaseCreateResponse:
      type: object
      required: [data]
      properties:
        data:
          allOf:
            - $ref: "#/components/schemas/Purchase"
            - type: object
              properties:
                initialPayment:
                  $ref: "#/components/schemas/PurchaseInitialPaymentResult"
    PurchaseInitialPaymentResult:
      description: >-
        Resultado del pago inicial. `registered`: el pago quedo registrado.
        `failed`: la compra SI se creo y quedo pendiente de pago; `message` es el
        motivo en español (el de `register_payment`, o un aviso de resultado
        incierto si no hubo respuesta clara).
      oneOf:
        - type: object
          required: [status, paymentId]
          properties:
            status:
              type: string
              enum: [registered]
            paymentId:
              type: string
        - type: object
          required: [status, message]
          properties:
            status:
              type: string
              enum: [failed]
            message:
              type: string
    PurchaseInitialPaymentInput:
      type: object
      required: [clientRequestId, method, amount]
      description: >-
        Pago inicial de la compra: los campos de `PaymentCreateInput` sin `saleId`
        ni `purchaseId` (el servidor usa la compra recien creada), con las mismas
        reglas por metodo. No admite vuelto.
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: >-
            Clave de idempotencia del pago, obligatoria y distinta de la de la
            compra: al reintentar el mismo intento el pago no se registra dos veces.
        method:
          $ref: "#/components/schemas/PaymentMethod"
        currency:
          type: string
          enum: [USD, VES]
        amount:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000000000000
        bankName:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        referenceCode:
          type: string
          maxLength: 100
        notes:
          type: string
          maxLength: 2000
        receivedDenominations:
          $ref: "#/components/schemas/PaymentDenominations"
    PurchaseCreateInput:
      type: object
      required: [supplierId, items]
      properties:
        initialPayment:
          $ref: "#/components/schemas/PurchaseInitialPaymentInput"
        clientRequestId:
          type: string
          format: uuid
          description: >-
            Clave de idempotencia opcional por intento: repetir la peticion con la
            misma clave devuelve la compra original sin mover stock.
        supplierId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PurchaseLineItemInput"
        status:
          $ref: "#/components/schemas/PurchaseStatus"
          description: Estado inicial. Solo `pedido` o `recibido`.
        notes:
          type: string
        purchaseNumber:
          type: string
        exchangeRateId:
          type: string
          format: uuid
        discountRef:
          type: number
          minimum: 0
        taxRef:
          type: number
          minimum: 0
        refRateVes:
          type: number
          minimum: 0
          exclusiveMinimum: true
    Payment:
      type: object
      required: [id, direction, method, amount, amountVes, amountRef, contactId]
      properties:
        id:
          type: string
        direction:
          $ref: "#/components/schemas/PaymentDirection"
        method:
          $ref: "#/components/schemas/PaymentMethod"
        saleId:
          type: string
        purchaseId:
