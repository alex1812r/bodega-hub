      x-permission: sales.view
      responses:
        "200":
          $ref: "#/components/responses/ReportObjectResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/purchases:
    get:
      tags: [Purchases]
      summary: Listar compras
      x-permission: purchases.view
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PurchaseStatus"
        - name: supplierId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          description: Texto a buscar en el numero de compra.
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: >-
            Primer dia del rango (dia operativo Caracas, incluido). Una fecha que
            no existe o con otro formato responde 400, igual que `from` posterior
            a `to`.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Ultimo dia del rango (dia operativo Caracas, incluido).
          schema:
            type: string
            format: date
        - name: pendingBalance
          in: query
          required: false
          description: >-
            `1` = solo compras con saldo pendiente: estado `pedido` o `recibido`
            y `totalRef - paidRef` de al menos 0.01 REF. Lo pagado es el de la
            cabecera de la compra (no se leen pagos), asi que vale para cualquier
            rol con `purchases.view`. Con este filtro la respuesta incluye
            `pendingBalanceRef`, la suma del saldo de todas las compras filtradas
            (no solo la pagina). Cualquier otro valor responde 400.
          schema:
            type: string
            enum: ["1"]
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "200":
          description: >-
            Lista de compras. Cada compra lleva `paidRef` y `paidVes`; con
            `pendingBalance=1` el objeto de la respuesta lleva ademas
            `pendingBalanceRef`.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Purchase"
    post:
      tags: [Purchases]
      summary: Crear compra
      description: >-
        Con `initialPayment` registra ademas un pago de la compra recien creada
        (un `register_payment` normal, en secuencia tras `create_purchase`). Compra
        y pago se validan y se autorizan antes de crear nada: un pago invalido
        responde 400 y sin `payments.manage` responde 403, en ambos casos sin
        crear la compra. Si la compra se crea y el pago falla, la respuesta sigue
        siendo 201 con la compra y `initialPayment.status = failed`: la compra queda
        pendiente de pago. Repetir la peticion con las mismas dos claves de
        idempotencia devuelve la misma compra y el mismo pago.
      x-permission: purchases.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseCreateInput"
      responses:
        "201":
          description: >-
            Compra creada. Lleva `initialPayment` solo si la peticion lo envio.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/purchases/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Purchases]
      summary: Obtener compra
      x-permission: purchases.view
      responses:
        "200":
          description: Compra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/purchases/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Purchases]
      summary: Cancelar compra
      x-permission: purchases.create
      responses:
        "200":
          $ref: "#/components/responses/ReportObjectResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/purchases/{id}/receive:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Purchases]
      summary: Recibir mercancia de compra en pedido
      description: >-
        Recibe el pedido y, en la MISMA transaccion, abre los empaques de las lineas
        marcadas "Desarmar al recibir" en los componentes de la receta de su producto
        (COM-14, RPC `receive_purchase_and_disassemble`). Si una apertura falla no se
        recibe nada. El cuerpo es opcional: sin el se desarman las lineas que el pedido
        guardo marcadas. La respuesta trae en cada linea `id`, `disassembleOnReceive` y
        `disassembled`.
      x-permission: purchases.create
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceivePurchaseInput"
      responses:
        "200":
          description: Compra recibida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            La compra no esta en pedido; una linea a desarmar ya no tiene receta de
            apertura activa (el mensaje nombra el producto: desmarcarla o activar la
            receta); o la clave de idempotencia ya se uso con otra lista.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/purchases/{id}/return:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Purchases]
      summary: Registrar devolucion a proveedor
      x-permission: purchases.create
      responses:
        "200":
          $ref: "#/components/responses/ReportObjectResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
