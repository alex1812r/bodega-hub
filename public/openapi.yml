  /api/tax-rates:
    get:
      tags: [Settings]
      summary: Listar alicuotas de IVA de la tienda
      description: |
        Catalogo de alicuotas vigente para la tienda de la sesion: las suyas mas las
        globales (`isGlobal = true`) que no haya redefinido. Incluye las inactivas salvo
        con `active=true`. Orden: `sortOrder` y despues `code`. No pagina.
        Basta uno de los permisos indicados. Usa mock o Supabase segun `API_DATA_SOURCE`.
      x-permission: products.view | purchases.view | settings.view
      parameters:
        - name: active
          in: query
          required: false
          description: Con `true` devuelve solo las alicuotas activas.
          schema:
            type: boolean
      responses:
        "200":
          description: Alicuotas de la tienda
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TaxRate"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Settings]
      summary: Crear alicuota de IVA de la tienda (admin)
      description: |
        Crea una alicuota propia de la tienda de la sesion (el `store_id` nunca viaja en
        el cuerpo). Si no se envia `code` se genera desde `label` ("General 12 %" ->
        `general-12`). Un `code` que la tienda ya ve, propio o global, responde 409:
        para cambiar una global se usa `PATCH /api/tax-rates/{id}`.
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxRateCreateInput"
      responses:
        "201":
          description: Alicuota creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxRateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Ya existe una alicuota con ese `code` para la tienda (propia o global)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/tax-rates/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Settings]
      summary: Cambiar o desactivar una alicuota de IVA (admin)
      description: |
        Cambia nombre, porcentaje, orden o estado. `code` no se puede cambiar (400).
        En Supabase todo el cambio lo hace la RPC `override_tax_rate_for_store` en una
        sola transaccion:

        - Alicuota propia de la tienda: se actualiza. Si cambia `pct`, se copia a las
          categorias y a la configuracion que la usan (las lineas de compra ya guardadas
          no cambian: su porcentaje es snapshot).
        - Alicuota global: no se modifica. La tienda recibe su propia fila con el mismo
          `code` (la respuesta trae un `id` NUEVO e `isGlobal = false`) y sus categorias
          y su alicuota por defecto pasan a esa fila. Las demas tiendas no cambian. Desde
          entonces el `id` de la global responde 404 para esta tienda: hay que usar el
          `id` devuelto (o volver a listar).
        - Un cambio que no cambia nada de una global la devuelve tal cual, sin crear fila.

        No hay DELETE: las alicuotas se desactivan con `isActive: false`.
      x-permission: users.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaxRateUpdateInput"
      responses:
        "200":
          description: Alicuota resultante (la fila de la tienda si se cambio una global)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaxRateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: >-
            La alicuota no existe para la tienda: id inexistente, de otra tienda, o
            global que la tienda ya redefinio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: >-
            No se puede desactivar: la usan categorias activas de la tienda o es su
            alicuota por defecto. `error.message` indica cuantas categorias y que hacer
            (mostrar tal cual). Tambien 409 con `details.retryable = true` si el cambio
            choco con otro en curso y no se aplico.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
