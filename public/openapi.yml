            $ref: "#/components/schemas/Permission"
    TaxRate:
      type: object
      required: [id, code, label, pct, isActive, isDefault, isGlobal, sortOrder]
      properties:
        id:
          type: string
        code:
          type: string
          description: >-
            Identificador estable de la alicuota (minusculas, numeros, guiones y puntos).
            Es lo que guarda cada linea de compra (`taxRateCode`); no cambia nunca.
        label:
          type: string
        pct:
          type: number
          minimum: 0
          maximum: 100
          description: Porcentaje con dos decimales (16 = IVA 16 %).
        isActive:
          type: boolean
          description: Una alicuota inactiva no se puede usar en compras nuevas.
        isDefault:
          type: boolean
          description: Es la alicuota por defecto de la tienda (`defaultTaxRateId` de /api/settings).
        isGlobal:
          type: boolean
          description: >-
            Semilla comun a todas las tiendas (exento 0, reducida 8, general 16). Al
            cambiarla, la tienda recibe su propia copia con otro `id`.
        sortOrder:
          type: integer
    TaxRateResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/TaxRate"
    TaxRateCreateInput:
      type: object
      additionalProperties: false
      required: [label, pct]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        pct:
          type: number
          minimum: 0
          maximum: 100
        code:
          type: string
          maxLength: 40
          pattern: "^[a-z0-9]+([.-][a-z0-9]+)*$"
          description: Opcional. Si falta se genera desde `label`.
    TaxRateUpdateInput:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Al menos un campo. `code` y `storeId` no se aceptan (400).
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 60
        pct:
          type: number
          minimum: 0
          maximum: 100
        isActive:
          type: boolean
        sortOrder:
          type: integer
          minimum: 0
          maximum: 100000
    AppSettings:
      type: object
      required: [businessName, defaultTaxRate, invoicePrefix, lowStockThreshold, pricing]
      properties:
        businessName:
          type: string
        defaultTaxRate:
          type: number
          description: Porcentaje de IVA por defecto. Igual al `pct` de `defaultTaxRateId` cuando existe.
        defaultTaxRateId:
          type: string
          description: >-
            Alicuota por defecto de la tienda para categorias nuevas (`id` de /api/tax-rates).
            Se cambia con PATCH /api/settings. Ausente si `defaultTaxRate` no corresponde a
            ninguna alicuota del catalogo.
        pricing:
          $ref: "#/components/schemas/PricingSettings"
        invoicePrefix:
          type: string
        lowStockThreshold:
          type: integer
        enabledPaymentMethods:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethod"
    PricingSettings:
      type: object
      required: [yellowFromPct, greenFromPct, chipsPct]
      description: >-
        Semaforo de ganancia (markup sobre el costo en REF) y % recomendados del
        bloque de precio. Es una alerta: no bloquea ventas ni cambia precios.
      properties:
        yellowFromPct:
          type: number
          minimum: 0
          maximum: 1000
          description: Por debajo de este % la ganancia es roja; desde aqui, amarilla. Debe ser menor que `greenFromPct`.
        greenFromPct:
          type: number
          minimum: 0
          maximum: 1000
          description: Desde este % la ganancia es verde.
        chipsPct:
          type: array
          minItems: 1
          maxItems: 6
          uniqueItems: true
          description: "% recomendados, en orden ascendente."
          items:
            type: number
            minimum: 0
            exclusiveMinimum: true
            maximum: 1000
    AppSettingsResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AppSettings"
    AppSettingsInput:
      type: object
      properties:
        businessName:
          type: string
          minLength: 1
        defaultTaxRate:
          type: number
          minimum: 0
          deprecated: true
          description: Porcentaje suelto. Usar `defaultTaxRateId`, que manda si llegan los dos.
        defaultTaxRateId:
          type: string
          minLength: 1
          description: >-
            Alicuota por defecto para categorias nuevas (`id` de /api/tax-rates). Debe
            existir y estar activa para la tienda; si no, 400 con el motivo en `error.message`.
        invoicePrefix:
          type: string
          minLength: 1
        lowStockThreshold:
          type: integer
          minimum: 0
        enabledPaymentMethods:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/PaymentMethod"
        pricing:
          allOf:
            - $ref: "#/components/schemas/PricingSettings"
          description: >-
            Semaforo de ganancia y chips de %. Se envia completo (los tres campos). Umbrales
            invertidos o iguales, chips repetidos, fuera de rango o mas de 6 responden 400 con el
            motivo en español en `error.message`.
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        role:
          $ref: "#/components/schemas/UserRole"
    StockMovement:
      type: object
      required: [id, productId, type, quantityDelta, stockAfter, createdAt]
      properties:
        id:
          type: string
        productId:
          type: string
        type:
          $ref: "#/components/schemas/StockMovementType"
        quantityDelta:
          type: integer
        stockAfter:
          type: integer
        conversionId:
          type: string
        reason:
          type: string
        saleId:
          type: string
        purchaseId:
          type: string
        createdAt:
          type: string
          format: date-time
    StockMovementResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/StockMovement"
    StockAdjustmentInput:
      type: object
      required: [productId, quantityDelta]
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: >-
            Clave de idempotencia opcional por intento: repetir la peticion con la
            misma clave devuelve el movimiento original sin mover stock.
        productId:
          type: string
        purchaseId:
          type: string
          format: uuid
          description: >-
            Compra a la que se liga la devolucion. Solo valido con
            `type: devolucion_proveedor` (400 con cualquier otro tipo). Con el vinculo
            el servidor exige que la compra sea de la tienda, este recibida e incluya
            el producto, y rechaza con 409 lo que supere lo recibido menos lo ya
            devuelto. Sin el, la devolucion no tiene tope.
        quantityDelta:
          type: integer
        reason:
          type: string
        saleId:
          type: string
          format: uuid
          description: >-
            Venta a la que se liga la devolucion. Solo valido con
            `type: devolucion_cliente` (400 con cualquier otro tipo). Con el vinculo
            el servidor exige que la venta sea de la tienda, este pagada o pendiente
            de pago e incluya el producto, y rechaza con 409 lo que supere lo vendido
            menos lo ya devuelto. Sin el, la devolucion no tiene tope.
        type:
          $ref: "#/components/schemas/StockMovementType"
    DashboardSummary:
      type: object
      required: [salesCount, totalRef, totalVes, lowStockCount, pendingSalesCount]
      properties:
        salesCount:
          type: integer
        totalRef:
          type: number
        totalVes:
          type: number
        lowStockCount:
          type: integer
        pendingSalesCount:
          type: integer
    LineItemInput:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
    ReceivePurchaseInput:
      type: object
      description: Cuerpo opcional de PATCH /api/purchases/{id}/receive (COM-14).
      properties:
        clientRequestId:
          type: string
          format: uuid
          description: >-
            Clave de idempotencia del intento: repetir la misma recepcion devuelve la
            compra ya recibida sin mover stock; la misma clave con otra lista es 409.
        disassemble:
          type: array
          maxItems: 500
          description: >-
            Lineas a desarmar al recibir. Si se envia, la lista ES el conjunto de lineas
            a desarmar y sustituye las marcas del pedido (`[]` = no desarmar ninguna).
            Sin el campo, mandan las marcas guardadas.
          items:
            type: object
            required: [purchaseItemId]
            properties:
              purchaseItemId:
                type: string
                description: Valor de `id` de la linea en el detalle de la compra.
              distribution:
                type: array
                minItems: 1
                maxItems: 20
                description: >-
                  Reparto real de la apertura (surtidos): solo componentes de la receta,
                  sin repetir, y debe sumar unidades de la receta x empaques de la linea
                  (400 si no). Sin el campo se usa la receta.
                items:
                  type: object
                  required: [unitProductId, units]
                  properties:
                    unitProductId:
                      type: string
                    units:
                      type: integer
                      minimum: 0
    PurchaseLineItemInput:
      type: object
      required: [productId, quantity, unitCostRef]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          minimum: 1
        unitCostRef:
          type: number
          minimum: 0
        supplierSku:
          type: string
        disassembleOnReceive:
          type: boolean
          description: >-
            "Desarmar al recibir" (COM-14). Solo en la linea de un producto que es el
            empaque de una receta de apertura activa (si no, 400 nombrando el producto).
            En un pedido la marca se guarda; en una compra recibida los empaques de la
            linea se abren en la misma transaccion. Ausente o `false` = compra de siempre.
        taxRateCode:
          type: string
          minLength: 1
          maxLength: 40
          description: >-
            `code` de la alicuota de IVA de la linea (/api/tax-rates). Opcional, pero cada
            linea debe enviar `taxRateCode`, `taxRate` o ambos. Debe existir y estar activa
            en la tienda (si no, 400); su `pct` es el porcentaje que se guarda en la linea.
        taxRate:
          type: number
          minimum: 0
          maximum: 100
          description: >-
            Porcentaje de IVA de la linea. Opcional si se envia `taxRateCode`. Solo, debe
            ser el `pct` de una alicuota activa de la tienda (400 si no); junto a
            `taxRateCode`, debe coincidir con el `pct` de esa alicuota (400 si no).
