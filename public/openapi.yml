  /api/payments:
    get:
      tags: [Payments]
      summary: Listar pagos
      description: >-
        Listado paginado desde tabla `payments` cuando `API_DATA_SOURCE=supabase`,
        mas recientes primero. `from` y `to` son dias operativos Caracas, ambos
        inclusive. `method`, `from` o `to` invalidos (o `from` posterior a `to`)
        responden 400. El vendedor solo ve cobros de venta: `purchaseId` o
        `direction=salida` responden 403.
      x-permission: payments.view
      parameters:
        - name: direction
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PaymentDirection"
        - name: method
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PaymentMethod"
        - name: from
          in: query
          required: false
          description: Fecha Caracas del pago (`YYYY-MM-DD`), inclusive.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Fecha Caracas del pago (`YYYY-MM-DD`), inclusive.
          schema:
            type: string
            format: date
        - name: saleId
          in: query
          required: false
          schema:
            type: string
        - name: purchaseId
          in: query
          required: false
          schema:
            type: string
        - name: contactId
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de pagos
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PaginatedList"
                      - type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Payments]
      summary: Registrar pago
      description: >-
        Crea pago con RPC `register_payment` cuando `API_DATA_SOURCE=supabase`.
        Con `clientRequestId`, repetir la peticion (misma clave, mismo contenido,
        mismo usuario) responde 201 con el pago original sin registrar otro pago ni
        mover caja, baul o el saldo del documento. Las ventas se cobran con
        `payments.manage` o `sales.create`; las compras exigen `payments.manage`.
      x-permission: payments.manage | sales.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCreateInput"
      responses:
        "201":
          description: Pago creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/payments/open-documents:
    get:
      tags: [Payments]
      summary: Listar documentos con saldo
      description: >-
        Ventas por cobrar y compras por pagar de la tienda, con el mismo criterio
        que acepta `register_payment`: venta `pendiente_pago`/`pagada` o compra no
        cancelada ni devuelta, con `total_ves - paid_ves > 0`. Ordenado por
        antiguedad (mas antiguo primero). Solo lectura. Las ventas piden
        `payments.manage` o `sales.create`; las compras piden `payments.manage` y
        un rol que vea pagos de compra (el vendedor recibe 403 con `type=purchase`
        y solo ventas si no envia `type`). Con `API_DATA_SOURCE=supabase` el saldo
        se remata en servidor sobre un tope de filas leidas (3000 ventas
        `pendiente_pago`, 5000 compras abiertas); si se alcanza,
        `totals.truncated` es `true`.
      x-permission: payments.manage | sales.create
      parameters:
        - name: type
          in: query
          required: false
          description: Sin valor, ventas y (si el rol puede) compras.
          schema:
            type: string
            enum: [sale, purchase]
        - name: search
          in: query
          required: false
          description: Numero de venta/compra, o nombre/RIF del contacto.
          schema:
            type: string
            maxLength: 120
        - name: contactId
          in: query
          required: false
          description: Cliente de la venta o proveedor de la compra.
          schema:
            type: string
            maxLength: 120
        - name: from
          in: query
          required: false
          description: Fecha Caracas del documento, inclusive.
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: false
          description: Fecha Caracas del documento, inclusive.
          schema:
            type: string
            format: date
        - name: olderThanDays
          in: query
          required: false
          description: >-
            Solo documentos con N dias o mas de antiguedad (fecha Caracas <= hoy - N).
            Combinado con `to` manda el limite mas antiguo.
          schema:
            type: integer
            minimum: 1
            maximum: 3650
        - $ref: "#/components/parameters/Skip"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Lista paginada de documentos con saldo y totales del conjunto filtrado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/PaginatedList"
                      - type: object
                        required: [totals]
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/OpenDocument"
                          totals:
                            type: object
                            required: [count, pendingVes, truncated]
                            properties:
                              count:
                                type: integer
                                minimum: 0
                              pendingVes:
                                type: number
                              pendingRef:
                                type: number
                              truncated:
                                type: boolean
                                description: La lectura alcanzo el tope de filas; el conjunto puede estar incompleto.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
