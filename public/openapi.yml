      summary: Obtener venta por clave de idempotencia
      description: >-
        Venta registrada con ese `clientRequestId`. El POS la consulta cuando se
        pierde la respuesta de `POST /api/sales` para saber si la venta llego a
        crearse antes de reintentar. Mismos permisos, filtro de tienda y forma que
        `GET /api/sales/{id}`; solo ventas del propio usuario salvo admin.
      x-permission: sales.view
      responses:
        "200":
          description: Venta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/sales/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Sales]
      summary: Obtener venta
      x-permission: sales.view
      responses:
        "200":
          description: Venta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/sales/{id}/cancel:
    parameters:
