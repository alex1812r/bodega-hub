          description: >-
            Conflicto. La clave `clientRequestId` ya se uso con otro contenido, la
            operacion choco con otra en curso (`error.details.retryable` = `true`),
            la devolucion ligada (`saleId` / `purchaseId`) supera lo vendido o
            recibido menos lo ya devuelto, el documento no esta en un estado
            devolvible, o la base aun no admite devoluciones ligadas (en ese caso
            no se registra nada: el servidor no repite la operacion sin el vinculo).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/inventory/conversions:
    post:
      tags: [Inventory]
      summary: Convertir empaque a unidades (dual SKU o surtido)
      description: >-
        Abre `packQuantity` empaques segun su receta activa. Sin `components` cada
        componente recibe `unitsPerPack x packQuantity`. Con `components` se registra
        el reparto REAL de esta apertura: solo componentes de la receta, sin
        repetidos y sumando `totalUnits x packQuantity` (si no, `400` sin mover
        nada). El valor (`packQuantity` x costo del empaque) se reparte en proporcion
        a unidades x `costWeight`. Deja 1 `conversion_salida` y 1 `conversion_entrada`
        por componente con unidades, todos con el mismo `conversionId`.
      x-permission: inventory.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packProductId, packQuantity]
              properties:
                packProductId:
                  type: string
                packQuantity:
                  type: integer
                  minimum: 1
                reason:
                  type: string
                components:
                  type: array
                  minItems: 1
                  maxItems: 20
                  description: >-
                    Opcional. Reparto real de la apertura de un surtido. Los
                    componentes con 0 unidades se pueden omitir.
                  items:
                    type: object
                    required: [unitProductId, units]
                    properties:
                      unitProductId:
                        type: string
                      units:
                        type: integer
                        minimum: 0
                clientRequestId:
                  type: string
                  format: uuid
                  description: >-
                    Clave de idempotencia opcional por intento: repetir la peticion con la
                    misma clave y el mismo contenido (incluido `components`) devuelve la
                    conversion original sin mover stock; con otro reparto responde `409`.
      responses:
        "201":
          description: Conversion creada (1 salida + 1 entrada por componente con unidades)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required:
                      [
                        conversionId,
                        packMovement,
                        unitMovement,
                        packQuantity,
                        unitQuantity,
                        unitsPerPack,
                        totalUnits,
                        components,
                      ]
                    properties:
                      conversionId:
                        type: string
                      packQuantity:
                        type: integer
                      unitQuantity:
                        type: integer
                        description: Unidades que salieron en total.
                      unitsPerPack:
                        type: integer
                        description: Unidades por empaque de la receta (igual a `totalUnits`).
                      totalUnits:
                        type: integer
                      unitCostRef:
                        type: number
                        description: Costo medio por unidad. En un surtido, el de cada componente va en `components`.
                      packMovement:
                        $ref: "#/components/schemas/StockMovement"
                      unitMovement:
                        allOf:
                          - $ref: "#/components/schemas/StockMovement"
                        description: Entrada del primer componente por id (con un solo componente, la de siempre).
                      components:
                        type: array
                        description: Una entrada por componente con unidades, por id de producto.
                        items:
                          $ref: "#/components/schemas/PackConversionOpenedComponent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
  /api/inventory/pack-conversions:
    get:
      tags: [Inventory]
      summary: Listar recetas de empaque activas (pares y surtidos)
