name: Auto close cash sessions

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  auto-close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke cash auto-close endpoint
        env:
          APP_BASE_URL: https://bodega-hub.vercel.app
          CRON_SECRET: 1f8b3c9a7d4e42a0b6c1f0d8c4a1e3f9b7a6d2c5e4f3a9b1c8d7e6f5a4b3c2d1
        run: |
          URL="${APP_BASE_URL%/}/api/cron/cash-sessions/auto-close"
          echo "Calling $URL"

          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")

          cat response.json

          if [ "$http_code" -ne 200 ]; then
            echo "Cron call failed with status $http_code" >&2
            exit 1
          fi
