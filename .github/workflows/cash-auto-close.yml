name: Auto close cash sessions

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  auto-close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Invoke cash auto-close endpoint
        env:
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Missing APP_BASE_URL or CRON_SECRET secret" >&2
            exit 1
          fi

          URL="${APP_BASE_URL%/}/api/cron/cash-sessions/auto-close"
          echo "Calling $URL"

          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$URL")

          cat response.json

          if [ "$http_code" -ne 200 ]; then
            echo "Cron call failed with status $http_code" >&2
            exit 1
          fi
