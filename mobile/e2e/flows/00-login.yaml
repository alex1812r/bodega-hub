# 00 - Login real contra Supabase y llegada a las tabs.
# Precondiciones: BFF arriba, credenciales en mobile/.env, usuario de seed.
appId: com.bodegahub.app
---
- launchApp
- assertVisible: { id: login-screen }
- takeScreenshot: 01-login
- tapOn: { id: login-email }
- inputText: vendedor@example.com
- tapOn: { id: login-password }
- inputText: Admin123!
- takeScreenshot: 02-formulario-lleno
- tapOn: { id: login-submit }
- assertVisible: { id: tab-inicio }
- takeScreenshot: 03-inicio
