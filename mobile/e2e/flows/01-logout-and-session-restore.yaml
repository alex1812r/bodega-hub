# 01 - Cerrar sesion vuelve al login; relanzar no restaura la sesion cerrada.
appId: com.bodegahub.app
---
- launchApp
- tapOn: { id: tab-mas }
- tapOn: Cerrar sesion
- assertVisible: { id: login-screen }
- takeScreenshot: 01-vuelta-al-login
- launchApp
- assertVisible: { id: login-screen }
- takeScreenshot: 02-sigue-deslogueado
